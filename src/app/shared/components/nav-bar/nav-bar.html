<nav class="nav-bar">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
        <path d="M3 6h18" />
        <path d="M16 10a4 4 0 0 1-8 0" />
      </svg>
    </span>
    <span class="brand-name">SmartCart</span>
  </a>

  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
  >
    <svg *ngIf="!menuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
    <svg *ngIf="menuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="6" y1="18" x2="18" y2="6" />
    </svg>
    <span class="sr-only">Toggle menu</span>
  </button>

  <div class="nav-collapsible" [class.open]="menuOpen">

    <div class="nav-links">
      <a
        class="nav-link"
        routerLink="/search"
        [queryParams]="{ gender: 'WOMEN' }"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Women
      </a>

      <a
        class="nav-link"
        routerLink="/search"
        [queryParams]="{ gender: 'MEN' }"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Men
      </a>

      <a
        class="nav-link"
        routerLink="/search"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Categories
      </a>
    </div>

    <!-- Search -->
    <div class="nav-search">
      <svg class="nav-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>

      <label
        for="nav-search-input"
        class="sr-only"
      >
        Search products
      </label>

      <input
        id="nav-search-input"
        type="text"
        placeholder="Search products..."
        [(ngModel)]="searchKeyword"
        name="searchKeyword"
        (keyup.enter)="onSearch()"
      />

      <!-- Search by Photo -->
      <button
        type="button"
        class="nav-search-camera"
        title="Search by photo"
        (click)="openImageSearch()"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
      </button>
    </div>

    <!-- Navigation icons -->
    <div class="nav-icons">

      <button
        type="button"
        class="icon-btn"
        title="Notifications"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </button>

      <button
        type="button"
        title="Cart"
        class="icon-btn cart-btn"
        routerLink="/cart"
        (click)="closeMenu()"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>

        <span
          class="cart-badge"
          *ngIf="cartService.itemCount() > 0"
        >
          {{ cartService.itemCount() }}
        </span>
      </button>

      <div class="account-container">

        <button
          type="button"
          class="icon-btn"
          title="Account"
          (click)="toggleAccountMenu()"
          [attr.aria-expanded]="accountMenuOpen"
        >
          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </button>


        <!-- Account popup -->
        <div class="account-menu" *ngIf="accountMenuOpen">

          <!-- ========================= -->
          <!-- LOGGED IN -->
          <!-- ========================= -->

          <ng-container *ngIf="isLoggedIn; else notLoggedIn">

            <div class="logged-in">

              <div class="account-username">
                {{ username }}
              </div>

              <div class="logged-in-label">
                {{ email }}
              </div>

              <div class="account-separator"></div>

              <button
                type="button"
                class="account-logout"
                (click)="logout()"
              >
                Logout
              </button>

            </div>
          </ng-container>

          <!-- ========================= -->
          <!-- NOT LOGGED IN -->
          <!-- ========================= -->
             <ng-template #notLoggedIn>

              <div class="not-logged-in">

                <div class="not-logged-in-label">
                  You are not logged in
                </div>

                <div class="account-separator"></div>

                <button
                  type="button"
                  class="account-signin"
                  (click)="goToLogin()"
                >
                  Sign In
                </button>

              </div>

            </ng-template>
        </div>

      </div>
    </div>
  </div>
</nav>


<!-- ========================================================= -->
<!-- Image Search Popup -->
<!-- ========================================================= -->

<div
  class="image-search-overlay"
  *ngIf="imageSearchOpen()"
  (click)="closeImageSearch()"
  (keydown.escape)="closeImageSearch()"
>

    <div
      class="image-search-dialog"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closeImageSearch()"
    >

    <!-- Header -->
    <div class="image-search-dialog__header">

      <h2 id="image-search-title">Search by Photo</h2>

      <button
        type="button"
        class="image-search-dialog__close"
        (click)="closeImageSearch()"
      >
        ✕
      </button>

    </div>


    <!-- Body -->
    <div class="image-search-dialog__body">

      <!-- Upload image -->
      <label
        class="image-search-upload"
        *ngIf="!imagePreviewUrl()"
      >

        <span class="image-search-upload__icon">
          📷
        </span>

        <span>
          Click to upload an image
        </span>

        <input
          type="file"
          accept="image/*"
          (change)="onImageFileSelected($event)"
          hidden
        />

      </label>


      <!-- Image preview -->
      <div
        class="image-search-preview"
        *ngIf="imagePreviewUrl()"
      >

        <img
          [src]="imagePreviewUrl()"
          alt="Preview of selected upload"
        />

        <button
          type="button"
          (click)="clearSelectedImage()"
        >
          Remove photo
        </button>

      </div>


      <!-- Error message -->
      <p
        class="image-search-error"
        *ngIf="imageSearchError()"
      >
        {{ imageSearchError() }}
      </p>

    </div>


    <!-- Actions -->
    <div class="image-search-dialog__actions">

      <button
        type="button"
        (click)="closeImageSearch()"
      >
        Cancel
      </button>

      <button
        type="button"
        [disabled]="!imagePreviewUrl() || imageSearchLoading()"
        (click)="onImageSearch()"
      >
        {{
          imageSearchLoading()
            ? 'Searching...'
            : 'Search'
        }}
      </button>

    </div>

  </div>

</div>
