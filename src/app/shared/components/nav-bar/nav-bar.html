<nav class="nav-bar">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-icon">🛍️</span>
    <span>SmartCart</span>
  </a>

  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle menu"
  >
    {{ menuOpen ? '✕' : '☰' }}
  </button>

  <div class="nav-collapsible" [class.open]="menuOpen">
    <div class="nav-links">
      <span class="nav-link placeholder" *ngFor="let label of placeholderLinks">{{ label }}</span>
    </div>

    <div class="nav-search">
      <input type="text" placeholder="Search products..." />
      <button type="button" title="Search by photo">📷</button>
    </div>
    <div class="nav-icons">
      <button type="button" title="Notifications">🔔</button>
      <button type="button" title="Cart" class="cart-btn">
        🛒
        <span class="cart-badge" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
      </button>
      <button type="button" title="Account">👤</button>
    </div>
  </div>
</nav>
