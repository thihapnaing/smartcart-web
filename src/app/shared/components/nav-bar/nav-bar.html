<nav class="nav-bar">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-icon">🛍️</span>
    <span>SmartCart</span>
  </a>

  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle menu"
  >
    {{ menuOpen ? '✕' : '☰' }}
  </button>

  <div class="nav-collapsible" [class.open]="menuOpen">
    <div class="nav-links">
      <a class="nav-link" routerLink="/search" [queryParams]="{ gender: 'WOMEN' }" (click)="closeMenu()">Women</a>
      <a class="nav-link" routerLink="/search" [queryParams]="{ gender: 'MEN' }" (click)="closeMenu()">Men</a>
      <a class="nav-link" routerLink="/search" (click)="closeMenu()">Categories</a>
    </div>

    <div class="nav-search">
      <input
        type="text"
        placeholder="Search products..."
        [(ngModel)]="searchKeyword"
        name="searchKeyword"
        (keyup.enter)="onSearch()"
      />
      <button type="button" title="Search by photo">📷</button>
    </div>
    <div class="nav-icons">
      <button type="button" title="Notifications">🔔</button>
      <button type="button" title="Cart" class="cart-btn" routerLink="/cart" (click)="closeMenu()">
        🛒
        <span class="cart-badge" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
      </button>
      <button type="button" title="Account">👤</button>
    </div>
  </div>
</nav>
