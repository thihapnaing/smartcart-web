<div class="container" style="padding-top: 1.5rem; padding-bottom: 3rem;">

  <!-- Heading tells the user which collection or search this is -->
  <div class="section__header">
    <h2 class="section__title">{{ pageTitle() }}</h2>
  </div>

  <!-- While waiting for the server, show placeholder boxes -->
  @if (loading()) {
    <div class="results-grid">
      @for (placeholder of [1, 2, 3, 4]; track placeholder) {
        <div class="skeleton" style="aspect-ratio: 2 / 3;"></div>
      }
    </div>
  }

  <!-- Server replied but sent back nothing -->
  @else if (results().length === 0) {
    <p>No products found.</p>
  }

  <!-- Server replied with products -->
  @else {
    <div class="results-grid">
      @for (p of results(); track p.id) {
        <a class="result-card" [routerLink]="['/products', p.id]">
          <img [src]="p.imageUrl" [alt]="p.name" />
          <h3>{{ p.name }}</h3>
          <p class="price">S${{ p.price }}</p>
          <p class="shop">{{ p.shopName }}</p>
        </a>
      }
    </div>
  }

</div>
