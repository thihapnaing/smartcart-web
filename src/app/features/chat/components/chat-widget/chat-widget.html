<button class="chat-fab" type="button" (click)="toggle()" *ngIf="!isOpen">🤖</button>

<div class="chat-panel" [class.expanded]="isExpanded" *ngIf="isOpen">
  <div class="chat-header">
    <div>
      <p class="title">SmartCart AI</p>
      <p class="subtitle">Agentic shopping assistant</p>
    </div>
    <div class="header-actions">
      <button
        class="expand-btn"
        type="button"
        (click)="toggleExpand()"
        [title]="isExpanded ? 'Collapse' : 'Expand'"
      >
        <svg *ngIf="!isExpanded" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9" />
          <polyline points="9 21 3 21 3 15" />
          <line x1="21" y1="3" x2="14" y2="10" />
          <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
        <svg *ngIf="isExpanded" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20" />
          <polyline points="20 10 14 10 14 4" />
          <line x1="14" y1="10" x2="21" y2="3" />
          <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
      </button>
      <button class="close-btn" type="button" (click)="toggle()">✕</button>
    </div>
  </div>

  <app-chat-message-list [messages]="chat.messages()"></app-chat-message-list>

  <div *ngIf="chat.isLoading()" class="typing">SmartCart AI is typing…</div>

  <app-suggestion-chips
    [suggestions]="chat.suggestions()"
    [disabled]="chat.isLoading()"
    (chipClicked)="onChipClicked($event)">
  </app-suggestion-chips>

  <div class="chat-input">
    <label for="chat-message-input" class="sr-only">Message SmartCart AI</label>
    <input
      id="chat-message-input"
      [(ngModel)]="draft"
      (keyup.enter)="send()"
      [disabled]="chat.isLoading()"
      placeholder="Ask me anything..." />
    <button type="button" (click)="send()" [disabled]="chat.isLoading()">➤</button>
  </div>
</div>
