sonar.projectKey=thihapnaing_smartcart-web
sonar.organization=thihapnaing0310
sonar.projectName=smartcart-web

# Point to Angular source folder
sonar.sources=src

# Exclude dependencies and test files
sonar.exclusions=**/node_modules/**,**/*.spec.ts

# Tell Sonar where the test files are
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Path to the LCOV report generated by Angular/Vitest
sonar.javascript.lcov.reportPaths=coverage/temp-web/lcov.info

sonar.sourceEncoding=UTF-8