sonar.projectKey=thihapnaing_smartcart-web
sonar.organization=thihapnaing0310
sonar.projectName=smartcart-web

# Point to Angular source folder
sonar.sources=src

# Prevent SonarCloud from scanning heavy dependency folders or test files
sonar.exclusions=**/node_modules/**,**/*.spec.ts

# Author: Htet Nandar (Grace)
# These are boilerplate with no real logic to unit test (plain model interfaces, env
# config, app bootstrap/route config) - excluded from the coverage % only, so they don't
# drag down the 80% gate. Still fully analyzed for bugs/code smells, unlike sonar.exclusions.
sonar.coverage.exclusions=**/models/**,**/*.model.ts,src/environments/**,src/main.ts,src/app/app.config.ts,src/app/app.routes.ts

sonar.sourceEncoding=UTF-8
